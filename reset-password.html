<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password | FixAm 9ja</title>
  <link rel="stylesheet" href="/admin-login.css" />
  <style>[hidden] { display: none !important; }</style>
</head>
<body>
  <main class="login-shell">
    <section class="login-copy">
      <a href="/">FixAm 9ja</a>
      <h1>Reset your password</h1>
      <p>Request a new reset link, then open it from your email to choose a new password.</p>
      <a href="/admin-login.html">Back to admin sign in</a>
    </section>
    <section class="login-card">
      <p id="resetNote" role="status" aria-live="polite">Checking your reset link…</p>
      <form id="requestForm" class="login-form" hidden>
        <label>Email address<input id="resetEmail" type="email" autocomplete="email" required /></label>
        <button type="submit" class="primary-action">Send password reset link</button>
      </form>
      <form id="passwordForm" class="login-form" hidden>
        <p id="resetIdentity"></p>
        <label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button type="submit" class="primary-action">Save new password</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/reset-password.js?v=20260911"></script>
</body>
</html>
